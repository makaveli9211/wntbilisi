name: Приём подписчиков

# Забирает из Telegram команды /start, /stop, /lang и нажатия кнопок,
# обновляет subscribers.json — и заодно рассылает сводку, если сегодня
# она ещё не уходила.
#
# Telegram хранит непрочитанные апдейты около 24 часов, потерять ничего нельзя;
# частота влияет только на то, как быстро человек увидит ответ бота.
#
# Сколько это стоит бесплатных минут (GitHub округляет запуск до минуты):
#   "*/5  * * * *"  каждые 5 минут   ~8600 мин/мес — ТОЛЬКО публичный репозиторий
#   "*/15 * * * *"  каждые 15 минут  ~2900 мин/мес — только публичный
#   "*/30 * * * *"  каждые 30 минут  ~1450 мин/мес — влезает в бесплатные 2000
#   "0    * * * *"  раз в час         ~720 мин/мес — с большим запасом

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: telegram-bot-state
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Опросить Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python bot.py --poll

      # Страховка от пропущенного расписания: GitHub регулярно проглатывает
      # запуски по cron, поэтому рассылка не привязана к одному срабатыванию.
      #
      # Бронь ставится ДО отправки и коммитится следующим шагом. Порядок важен:
      # сохраняйся отметка после рассылки — непрошедший push означал бы, что
      # сводка уходит заново каждые пять минут до конца суток.
      - name: Забронировать сегодняшнюю рассылку
        id: claim
        continue-on-error: true     # код 20 = «рассылать не нужно», это не ошибка
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python bot.py --claim-day

      - name: Записать бронь в репозиторий
        id: save
        if: always()
        run: bash .github/save-state.sh "Обновление списка подписчиков"

      # Подтверждаем обработку только после того, как offset лёг в репозиторий.
      # Подтвердив, мы разрешаем Telegram выбросить апдейты — если сделать это
      # до коммита и push не пройдёт, подписка исчезнет вместе с раннером.
      - name: Подтвердить обработку апдейтов
        if: steps.save.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python bot.py --confirm

      # Отправляем только если бронь ДЕЙСТВИТЕЛЬНО записана в репозиторий.
      # Не проверь мы это — непрошедший push вернул бы ту самую беду:
      # каждый следующий запуск считал бы, что сводка ещё не уходила.
      - name: Разослать сводку
        if: steps.claim.outcome == 'success' && steps.save.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FOOTBALL_API_TOKEN: ${{ secrets.FOOTBALL_API_TOKEN }}
        run: python bot.py --send-now

      # Второй раз — сохранить тех, кого вычеркнула рассылка.
      - name: Сохранить итог рассылки
        if: always()
        run: bash .github/save-state.sh "Обновление списка подписчиков"
