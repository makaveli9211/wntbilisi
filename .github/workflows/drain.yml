name: Очистить очередь Telegram

# Аварийная кнопка. Выбрасывает всё, что накопилось у Telegram, не отвечая
# ни на одну команду, и выставляет offset за последний апдейт.
# Запускается только вручную.
#
# Когда нужно: бот из-за сбоя не подтверждал обработку, backlog раздулся,
# и на ближайшем запуске он попытается ответить на всё разом.

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: telegram-bot-state
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Выбросить накопившиеся апдейты
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python bot.py --drain

      - name: Сохранить offset
        if: always()
        run: bash .github/save-state.sh "Очистка очереди Telegram"
