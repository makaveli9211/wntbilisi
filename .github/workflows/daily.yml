name: Утренняя сводка в Telegram

on:
  schedule:
    # 04:00 UTC = 08:00 в Тбилиси (Грузия круглый год UTC+4, перевода часов нет).
    # GitHub может задержать запуск на 5–20 минут при высокой нагрузке.
    - cron: "0 4 * * *"

  workflow_dispatch:      # кнопка "Run workflow" для ручной проверки
    inputs:
      lang:
        description: "Язык: пусто — у каждого подписчика свой, ru/ka — всем принудительно"
        type: choice
        options: ["", ru, ka]
        default: ""

permissions:
  contents: write        # нужен, чтобы вычеркнуть заблокировавших бота

# Общая группа с приёмом подписчиков: два workflow никогда не пишут в репозиторий разом.
concurrency:
  group: telegram-bot-state
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Подхватываем тех, кто нажал /start уже после последнего опроса,
      # чтобы человек не ждал сводку лишние сутки.
      - name: Добрать свежих подписчиков
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python bot.py --poll

      - name: Разослать сводку
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Необязательный секрет: этот чат получает сводку всегда,
          # даже если не нажимал /start. Удобно для себя.
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Тоже необязательный: без него просто не будет блока с футболом.
          FOOTBALL_API_TOKEN: ${{ secrets.FOOTBALL_API_TOKEN }}
        run: |
          if [ -n "${{ inputs.lang }}" ]; then
            python bot.py --lang "${{ inputs.lang }}"
          else
            python bot.py
          fi

      - name: Сохранить список подписчиков
        run: |
          set -e
          if git diff --quiet -- subscribers.json; then
            echo "изменений нет"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Список подписчиков — генерируемый файл, текстовое слияние для него
          # бессмысленно. Поэтому: забираем версию из репозитория, объединяем
          # списки по смыслу и кладём результат ровно поверх удалённой ветки.
          # Конфликт при таком порядке невозможен.
          for attempt in 1 2 3; do
            git fetch origin main
            git show origin/main:subscribers.json > /tmp/remote.json 2>/dev/null \
              || echo '{}' > /tmp/remote.json
            python bot.py --merge /tmp/remote.json

            git reset --mixed origin/main >/dev/null
            git add subscribers.json
            if git diff --cached --quiet; then
              echo "после слияния коммитить нечего"
              exit 0
            fi
            git commit -m "Обновление списка подписчиков"

            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push не прошёл (попытка $attempt), пробую ещё раз"
            sleep 5
          done

          echo "не удалось сохранить список после трёх попыток"
          exit 1
