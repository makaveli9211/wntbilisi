name: Утренняя сводка в Telegram

on:
  schedule:
    # 04:00 UTC = 08:00 в Тбилиси (Грузия круглый год UTC+4, перевода часов нет).
    # GitHub выполняет расписание «по возможности» и запуски пропускает —
    # поэтому на этот cron рассылка не полагается, он лишь один из шансов.
    # Настоящая страховка живёт в subscribe.yml, который идёт каждые 5 минут.
    - cron: "0 4 * * *"

  workflow_dispatch:
    inputs:
      lang:
        description: "Язык: пусто — у каждого свой, ru/ka — всем принудительно"
        type: choice
        options: ["", "ru", "ka"]
        default: ""

permissions:
  contents: write

concurrency:
  group: telegram-bot-state
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Подхватываем тех, кто нажал /start только что.
      - name: Добрать свежих подписчиков
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python bot.py --poll

      - name: Забронировать сегодняшнюю рассылку
        id: claim
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FORCED_LANG: ${{ inputs.lang }}
        run: |
          # Ручной запуск шлёт всегда — им и проверяют.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ручной запуск: бронь не требуется"
            exit 0
          fi
          python bot.py --claim-day

      - name: Записать бронь в репозиторий
        id: save
        if: always()
        run: bash .github/save-state.sh "Обновление списка подписчиков"

      # Подтверждаем обработку только после того, как offset лёг в репозиторий.
      # Подтвердив, мы разрешаем Telegram выбросить апдейты — если сделать это
      # до коммита и push не пройдёт, подписка исчезнет вместе с раннером.
      - name: Подтвердить обработку апдейтов
        if: steps.save.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python bot.py --confirm

      # Отправляем только если бронь ДЕЙСТВИТЕЛЬНО записана в репозиторий.
      # Не проверь мы это — непрошедший push вернул бы ту самую беду:
      # каждый следующий запуск считал бы, что сводка ещё не уходила.
      - name: Разослать сводку
        if: steps.claim.outcome == 'success' && steps.save.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FOOTBALL_API_TOKEN: ${{ secrets.FOOTBALL_API_TOKEN }}
          FORCED_LANG: ${{ inputs.lang }}
        run: |
          if [ -n "$FORCED_LANG" ]; then
            # Принудительный язык — это проверка: день она не закрывает,
            # чтобы настоящая сводка всё равно ушла каждому на своём языке.
            python bot.py --lang "$FORCED_LANG"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python bot.py
          else
            python bot.py --send-now
          fi

      - name: Сохранить итог рассылки
        if: always()
        run: bash .github/save-state.sh "Обновление списка подписчиков"
